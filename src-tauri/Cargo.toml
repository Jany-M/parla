[package]
name = "parla"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first meeting transcription, speaker labels and live translation"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
parla-core = { path = "../crates/parla-core", features = ["sherpa", "device-capture"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_Foundation", "Win32_System_Kernel"] }
