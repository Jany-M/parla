[package]
name = "parla-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# sherpa-onnx backed VAD / ASR / speaker-embedding engines
sherpa = ["dep:sherpa-onnx"]
# live device capture (cpal) — OS audio backends
device-capture = ["dep:cpal"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
whatlang = "0.16"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
dirs = "6"
sys-locale = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "mkv", "alac", "adpcm"] }
rubato = "0.16"
sherpa-onnx = { version = "*", optional = true }
cpal = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
