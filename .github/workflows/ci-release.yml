# Parla CI / release orchestrator
#
# Gate diagram (every job below is a hard gate  -  downstream only runs if upstream is green):
#
#   ┌──────────────┐
#   │ gate-changes │  (detect app-build path changes; always continues)
#   └──────┬───────┘
#          │
#          │  if build paths changed ─────────────────────────────┐
#          │                                                      │
#          ├──────────────────┬────────────────────┐              │
#          ▼                  ▼                    ▼              │
#   ┌──────────────┐  ┌───────────────┐  ┌──────────────────┐     │
#   │ gate-typechk │  │ gate-rust     │  │ gate-frontend    │     │
#   │ (tsc)        │  │ (cargo test)  │  │ (vitest)         │     │
#   └──────┬───────┘  └───────┬───────┘  └────────┬─────────┘     │
#          │                  │                   │              │
#          └────────────┬─────┴───────────────────┘              │
#                       ▼                                        │
#              ┌─────────────────┐  meta-only changes (FUNDING,  │
#              │ gate-all-green  │◄─ README, LICENSE, …): skip   │
#              │                 │   tests and still succeed     ◄┘
#              └────────┬────────┘
#                       │  only on push to main, build paths changed,
#                       │  and commit is not a post-release bump
#                       ▼
#          ┌────────────────┐   ┌──────────────┐
#          │ release-windows│   │ release-macos│  parallel artifacts
#          └───────┬────────┘   └──────┬───────┘
#                  └─────────┬─────────┘
#                            ▼
#                   ┌─────────────────┐
#                   │ release-publish │  one GitHub Release (exe + dmg)
#                   └────────┬────────┘
#                            ▼
#                   ┌─────────────────┐
#                   │ post-bump       │  X.Y.Z → X.Y.Z+1 for next pull
#                   └────────┬────────┘
#                            ▼
#                   ┌─────────────────┐
#                   │ prune-releases  │  keep latest 2 GitHub Releases only
#                   └─────────────────┘
#
# ```mermaid
# flowchart TD
#   A[gate-changes] -->|build paths| B[gate-typecheck]
#   A -->|build paths| C[gate-rust-tests]
#   A -->|build paths| D[gate-frontend-tests]
#   A --> E[gate-all-green]
#   B --> E
#   C --> E
#   D --> E
#   E -->|main + build paths + not bump commit| W[release-windows]
#   E -->|same release if| M[release-macos]
#   W --> P[release-publish]
#   M --> P
#   P --> G[post-bump]
#   P --> H[prune-releases keep 2]
# ```

name: CI / Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # jsdom 31 / undici need Node 22+; match current LTS line on runners (Node 24)
  NODE_VERSION: "24"

jobs:
  # ── Gate 0: change detection ───────────────────────────────────────────────
  gate-changes:
    name: "Gate 0 · change detect"
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build:
              - 'src/**'
              - 'src-tauri/**'
              - 'crates/**'
              - 'resources/**'
              - 'scripts/**'
              - '.cargo/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - '.github/workflows/ci-release.yml'

  # ── Gate 1: TypeScript ─────────────────────────────────────────────────────
  gate-typecheck:
    name: "Gate 1 · typecheck"
    needs: gate-changes
    if: needs.gate-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # ── Gate 2: Rust unit tests ────────────────────────────────────────────────
  gate-rust-tests:
    name: "Gate 2 · rust tests"
    needs: gate-changes
    if: needs.gate-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run parla-core lib tests
        run: cargo test -p parla-core --lib

  # ── Gate 3: Frontend tests ─────────────────────────────────────────────────
  gate-frontend-tests:
    name: "Gate 3 · frontend tests"
    needs: gate-changes
    if: needs.gate-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ── Join gate: all tests green (or skipped for meta-only changes) ──────────
  gate-all-green:
    name: "Gate ✓ · all tests green"
    needs: [gate-changes, gate-typecheck, gate-rust-tests, gate-frontend-tests]
    # Skipped test jobs would otherwise skip this join; always() + explicit checks.
    if: always() && needs.gate-changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: |
          build='${{ needs.gate-changes.outputs.build }}'
          echo "build_paths_changed=$build"
          if [ "$build" != "true" ]; then
            echo "No app/build paths changed (e.g. FUNDING.yml, README, LICENSE)  -  tests skipped."
            exit 0
          fi
          for result in \
            '${{ needs.gate-typecheck.result }}' \
            '${{ needs.gate-rust-tests.result }}' \
            '${{ needs.gate-frontend-tests.result }}'
          do
            if [ "$result" != "success" ]; then
              echo "A test gate did not succeed (got: $result)"
              exit 1
            fi
          done
          echo "typecheck ✓  rust ✓  frontend ✓"

  # ── Release: Windows NSIS (artifact only) ──────────────────────────────────
  release-windows:
    name: "Release · Windows NSIS"
    needs: [gate-changes, gate-all-green]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.gate-changes.outputs.build == 'true' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read current version
        id: version
        shell: pwsh
        run: |
          $raw = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = $raw.version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Releasing version $v (pre-bump)"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: parla-windows-release
          cache-targets: true
          cache-all-crates: true

      - name: Install frontend deps
        run: npm ci

      - name: Build Windows installer
        run: .\scripts\build.ps1 -SkipTests -SkipNpm

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: parla-windows-nsis
          path: release/*-setup.exe
          if-no-files-found: error

  # ── Release: macOS universal DMG (artifact only; Darwin tools only here) ───
  release-macos:
    name: "Release · macOS DMG"
    needs: [gate-changes, gate-all-green]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.gate-changes.outputs.build == 'true' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: parla-macos-release
          cache-targets: true
          cache-all-crates: true

      - name: Install frontend deps
        run: npm ci

      - name: Build universal macOS DMG
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh --skip-tests --skip-npm

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: parla-macos-dmg
          path: release/*.dmg
          if-no-files-found: error

  # ── Publish: one GitHub Release with both artifacts ────────────────────────
  release-publish:
    name: "Release · publish"
    needs: [release-windows, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.release-windows.outputs.version }}
      tag: ${{ needs.release-windows.outputs.tag }}
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: parla-windows-nsis
          path: dist

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: parla-macos-dmg
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-windows.outputs.tag }}
          VER: ${{ needs.release-windows.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find dist -type f \( -name '*-setup.exe' -o -name '*.dmg' \) | sort)
          if [ "${#FILES[@]}" -lt 2 ]; then
            echo "Expected Windows .exe and macOS .dmg in dist/; got: ${FILES[*]-none}"
            exit 1
          fi
          NOTES="$(cat <<EOF
          Automated builds for Parla ${VER}.

          - **Windows:** run the \`-setup.exe\` installer (per-user, no admin).
          - **macOS:** open the universal \`.dmg\`, drag Parla to Applications. The build is unsigned; first launch may need **right-click → Open**, or:
            \`xattr -dr com.apple.quarantine /Applications/Parla.app\`
          - Grant **Microphone** (and Screen Recording / system audio if prompted) in System Settings if meters stay flat.
          - In-app update is Windows-only; on Mac install the new DMG from Releases.

          Built from commit ${{ github.sha }}.
          EOF
          )"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists  -  uploading assets (clobber)"
            gh release upload "$TAG" "${FILES[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "${{ github.repository }}" \
              --title "Parla $VER" \
              --notes "$NOTES"
          fi

  # ── Post-release: bump repo version for the next pull ──────────────────────
  post-bump:
    name: "Post · bump version for next pull"
    needs: release-publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Patch-bump version files
        id: bump
        shell: pwsh
        run: .\scripts\bump-version.ps1

      - name: Commit and push bump
        shell: pwsh
        env:
          NEXT: ${{ steps.bump.outputs.next }}
          # Attribute the bump to the human who triggered the release (not github-actions[bot]),
          # so the bot does not appear in the repo Contributors list.
          GIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name || 'Jany Martelli' }}
          GIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email || 'info@shambix.com' }}
          GIT_COMMITTER_NAME: ${{ github.event.head_commit.author.name || 'Jany Martelli' }}
          GIT_COMMITTER_EMAIL: ${{ github.event.head_commit.author.email || 'info@shambix.com' }}
        run: |
          git add Cargo.toml package.json src-tauri/tauri.conf.json
          git -c user.name="$env:GIT_AUTHOR_NAME" -c user.email="$env:GIT_AUTHOR_EMAIL" `
            commit -m "chore: bump version to $env:NEXT [skip release]"
          git push

  # ── Prune: retain only the latest 2 releases ───────────────────────────────
  prune-releases:
    name: "Post · prune old releases (keep 2)"
    needs: release-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete releases beyond the latest two
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # List releases newest-first; drop the first two; delete the rest (+ tags).
          mapfile -t OLD < <(gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:][].tagName')
          if [ "${#OLD[@]}" -eq 0 ]; then
            echo "Nothing to prune (≤2 releases)."
            exit 0
          fi
          for tag in "${OLD[@]}"; do
            echo "Pruning release $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
